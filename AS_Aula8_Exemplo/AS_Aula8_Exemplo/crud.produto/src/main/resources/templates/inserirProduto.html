<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Inserir Produto</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>
            $(document).ready(function () {
                $("#submit").on('click', function () {
                    var formData = new Object();
                    formData.nomeProduto = $("#nomeProduto").val();
                    formData.precoProduto = $("#precoProduto").val();
                    formData.quantidadeProduto = $("#quantidadeProduto").val();
                    $.ajax({
                        url: '/inserirProduto',
                        type: "POST",
                        contentType: 'application/json; charset=ISO-8859-1',
                        dataType: 'json',
                        data: JSON.stringify(formData),
                        success: function () {
                            limparCampos();
                        },
                        error: function (request, message, error) {
                            limparCampos();
                        }
                    });
                })
            });
            function limparCampos() {
                $("#idProduto").val("");
                $("#nomeProduto").val("");
                $("#precoProduto").val("");
                $("#quantidadeProduto").val("");
            }
        </script>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-sm-6">
                    <h2>Dados do produto a inserir</h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <form id="form" action="" method="POST">
                    <table id="productTable" 
                           class="table table-bordered
                           table-condensed table-striped">
                        <tbody>
                            <tr>
                                <td>Nome</td>
                                <td><input type="text" id="nomeProduto" name="nomeProduto"/></td>
                            </tr>
                            <tr>
                                <td>Preço</td>
                                <td><input type="text" id="precoProduto" name="precoProduto"/></td>
                            </tr>
                            <tr>
                                <td>Quantidade</td>
                                <td><input type="text" id="quantidadeProduto" name="quantidadeProduto"/></td>
                        </tbody>
                    </table>
                    <input class="btn btn-primary" id="submit" type="button" value="Inserir" />
                </form>
            </div>
        </div>
        <a href="/">   Retornar à lista</a>
    </body>
</html>
