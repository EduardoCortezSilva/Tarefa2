<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Alterar Produto</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>
            $(document).ready(function () {
                const urlParams = new URLSearchParams(location.search);
                getProduto(urlParams.get('id'));
                $("#submit").on('click', function () {
                    var formData = new Object();
                    formData.idProduto = $("#idProduto").val();
                    formData.nomeProduto = $("#nomeProduto").val();
                    formData.precoProduto = $("#precoProduto").val();
                    formData.quantidadeProduto = $("#quantidadeProduto").val();
                    $.ajax({
                        url: '/alterarProduto',
                        type: "POST",
                        contentType: 'application/json; charset=ISO-8859-1',
                        dataType: 'json',
                        data: JSON.stringify(formData),
                        success: function () {
                            limparCampos();
                        },
                        error: function (request, message, error) {
                            limparCampos();
                        }
                    });
                })
            });
            function limparCampos(){
                $("#idProduto").val("");
                $("#nomeProduto").val("");
                $("#precoProduto").val("");
                $("#quantidadeProduto").val("");
            }
            function getProduto(id) {
                $.ajax({
                    url: '/produto/' + id,
                    type: 'GET',
                    dataType: 'json',
                    success: function (produto) {
                        produtoBuildTable(produto);
                    },
                    error: function (request, message, error) {
                        handleException(request, message, error);
                    }
                });
            }
            function produtoBuildTable(produto) {
                if ($("#productTable tbody").length === 0) {
                    $("#productTable").append("<tbody></tbody>");
                }
                var content =
                        "<tr>" +
                        "<td>ID</td>" +
                        '<td><input type="text" id="idProduto" name="idProduto" value="' + produto.idProduto + '" readonly="readonly"/></td>' +
                        "<\tr>" +
                        "<tr>" +
                        "<td>Nome</td>" +
                        '<td><input type="text" id="nomeProduto" name="nomeProduto" value="' + produto.nomeProduto + '"/></td>' +
                        "<\tr>" +
                        "<tr>" +
                        "<td>Preço</td>" +
                        '<td><input type="text" id="precoProduto" name="precoProduto" value="' + produto.precoProduto + '"/></td>' +
                        "<\tr>" +
                        "<tr>" +
                        "<td>Quantidade</td>" +
                        '<td><input type="text" id="quantidadeProduto" name="quantidadeProduto" value="' + produto.quantidadeProduto + '"/></td>' +
                        "<\tr>" +
                        "</tr>";
                $("#productTable tbody").append(content);
            }
            function handleException(request, message, error) {
                var msg = "";
                msg += "Code: " + request.status + "\n";
                msg += "Text: " + request.statusText + "\n";
                if (request.responseJSON !== null) {
                    msg += "Message" + request.responseJSON.Message + "\n";
                }
                alert(msg);
            }
        </script>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-sm-6">
                    <h2>Dados do produto a alterar</h2>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <form id="form" action="" method="POST">
                    <table id="productTable" 
                           class="table table-bordered
                           table-condensed table-striped">
                    </table>
                    <input class="btn btn-primary" id="submit" type="button" value="Alterar" />
                </form>
            </div>
        </div>
        <a href="/">   Retornar à lista</a>
    </body>
</html>
