<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotelaria - Hotéis</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>🏨 Hotelaria</h1>
    <nav>
      <a href="/">Início</a>
      <a href="/hoteis" class="ativo">Hotéis</a>
      <a href="/quartos">Quartos</a>
    </nav>
  </header>
  <main>
    <div id="mensagem"></div>

    <section class="cartao">
      <h2 id="tituloForm">Novo hotel</h2>
      <form id="formHotel" autocomplete="off">
        <input type="hidden" id="id">
        <div class="grade-form">
          <div>
            <label for="nome">Nome *</label>
            <input type="text" id="nome" maxlength="255" required>
          </div>
          <div>
            <label for="categoria">Categoria (estrelas)</label>
            <input type="number" id="categoria" min="1" max="5">
          </div>
          <div class="larga">
            <label for="endereco">Endereço *</label>
            <input type="text" id="endereco" maxlength="500" required>
          </div>
        </div>
        <div class="acoes">
          <button type="submit" id="btnSalvar">Salvar</button>
          <button type="button" id="btnCancelar" class="secundario">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="cartao">
      <h2>Hotéis cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nome</th><th>Endereço</th><th>Categoria</th><th></th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/hoteis.js"></script>
</body>
</html>
