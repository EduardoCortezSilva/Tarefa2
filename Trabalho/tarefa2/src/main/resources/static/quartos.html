<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotelaria - Quartos</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>🏨 Hotelaria</h1>
    <nav>
      <a href="/">Início</a>
      <a href="/hoteis">Hotéis</a>
      <a href="/quartos" class="ativo">Quartos</a>
    </nav>
  </header>
  <main>
    <div id="mensagem"></div>

    <section class="cartao">
      <h2 id="tituloForm">Novo quarto</h2>
      <form id="formQuarto" autocomplete="off">
        <input type="hidden" id="id">
        <div class="grade-form">
          <div>
            <label for="hotel">Hotel *</label>
            <select id="hotel" required></select>
          </div>
          <div>
            <label for="numero">Número *</label>
            <input type="text" id="numero" maxlength="20" required>
          </div>
          <div>
            <label for="tipo">Tipo *</label>
            <input type="text" id="tipo" maxlength="100" placeholder="Ex.: Solteiro, Casal, Suíte" required>
          </div>
          <div>
            <label for="diaria">Diária (R$) *</label>
            <input type="number" id="diaria" min="0" step="0.01" required>
          </div>
        </div>
        <div class="acoes">
          <button type="submit" id="btnSalvar">Salvar</button>
          <button type="button" id="btnCancelar" class="secundario">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="cartao">
      <h2>Quartos cadastrados</h2>
      <div class="filtro">
        <label for="filtroHotel" style="margin:0">Filtrar por hotel:</label>
        <select id="filtroHotel"></select>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Hotel</th><th>Número</th><th>Tipo</th><th class="num">Diária</th><th></th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/quartos.js"></script>
</body>
</html>
