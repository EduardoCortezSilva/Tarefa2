<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotelaria - Início</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>🏨 Hotelaria</h1>
    <nav>
      <a href="/" class="ativo">Início</a>
      <a href="/hoteis">Hotéis</a>
      <a href="/quartos">Quartos</a>
    </nav>
  </header>
  <main>
    <div class="inicio-links">
      <div class="cartao">
        <h2>Hotéis</h2>
        <p>Cadastre, edite e exclua hotéis (lado 1 da relação).</p>
        <a class="botao" href="/hoteis">Abrir cadastro de hotéis</a>
      </div>
      <div class="cartao">
        <h2>Quartos</h2>
        <p>Cadastre os quartos de cada hotel (lado N da relação).</p>
        <a class="botao" href="/quartos">Abrir cadastro de quartos</a>
      </div>
    </div>
  </main>
</body>
</html>
